<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品細節 - 甜時 Sweet</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/detail.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="#">甜時，Sweet</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">關於我們</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">產品介紹</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <div class="banner">
        <img src="images/banner.jpg" alt="Banner" class="img-fluid">
    </div>
    <div class="text-center my-4">
        <h2>產品細節</h2>
    </div>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6">
                <img src="images/cake01.jpg" class="img-fluid" alt="鄉村檸檬乳酪塔">
            </div>
            <div class="col-md-6 text-left">
                <h3>鄉村檸檬乳酪塔</h3>
                <p>採用紐西蘭小鄉村濃郁的乳酪香味搭配清涼檸檬口感是鄉村中最具影響力的一道甜點。</p>
                <p>價錢：79元 / 片</p>
                <p>分類：
                    <button class="btn btn-secondary btn-sm">蛋糕</button>
                    <button class="btn btn-secondary btn-sm">水果</button>
                </p>
                <form class="form-inline">
                    <div class="form-group mb-2">
                        <label for="quantity" class="mr-2">數量：</label>
                        <input type="number" class="form-control mr-2" id="quantity" min="1" value="1">
                    </div>
                    <button type="submit" class="btn btn-primary mb-2">送出</button>
                </form>
            </div>
        </div>
    </div>
    <footer class="text-center py-3">
        <p>&copy; <span id="year"></span> 甜時 Sweet. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="js/bootstrap.js"></script>
