<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人部落格</title>
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container text-center my-5">
        <img src="images/avatar.jpg" class="rounded-circle" alt="Avatar" width="150" height="150">
        <p class="mt-3 text-white">Hi，這裡記錄了我的美食點滴。</p>
    </div>
    <div class="container">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/01.jpg" class="card-img-top" alt="香煎鮭魚排">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">香煎鮭魚排</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/02.jpg" class="card-img-top" alt="水果總匯優格">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">水果總匯優格</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/03.jpg" class="card-img-top" alt="青醬時蔬蝴蝶麵">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">青醬時蔬蝴蝶麵</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/04.jpg" class="card-img-top" alt="鮮橙黑胡椒牛排">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">鮮橙黑胡椒牛排</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/05.jpg" class="card-img-top" alt="岩鹽牛排">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">岩鹽牛排</h5>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card bg-transparent text-white text-center">
                    <img src="images/thumbs/06.jpg" class="card-img-top" alt="莓果鬆餅">
                    <div class="card-body" style="background-color: rgba(255, 255, 255, 0.25);">
                        <h5 class="card-title">莓果鬆餅</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer mt-auto py-3 bg-dark text-white text-center">
        <div class="container">
            <span>&copy; 2025 個人部落格. All rights reserved.</span>
        </div>
    </footer>
    <script src="js/bootstrap.js"></script>
</body>
</html>
