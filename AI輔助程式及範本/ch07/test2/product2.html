    <main class="flex-grow-1">
      <section class="banner-area" aria-label="banner 圖片區"></section>

      <section class="container my-4 my-lg-5 text-center">
        <h2 class="page-title mb-4">產品介紹</h2>

        <div class="row g-4 product-grid">
          <div class="col-lg-4">
            <div class="card h-100 product-card shadow-sm">
              <img src="../images/cake01.jpg" class="card-img-top product-image" alt="鄉村檸檬乳酪塔" />
              <div class="card-body d-flex flex-column text-center">
                <h5 class="card-title">鄉村檸檬乳酪塔</h5>
                <p class="card-text flex-grow-1">

                <a href="#" class="btn btn-outline-danger align-self-end">我要訂購</a>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card h-100 product-card shadow-sm">
              <img src="../images/cake02.jpg" class="card-img-top product-image" alt="精緻手工巧克力蛋糕" />
              <div class="card-body d-flex flex-column text-center">
                <h5 class="card-title">精緻手工巧克力蛋糕</h5>
                <p class="card-text flex-grow-1">
                  使用濃郁可可與手工製作工法，打造層次豐富、香氣十足的甜點。

                <a href="#" class="btn btn-outline-danger align-self-end">我要訂購</a>

            </div>

              <div class="card-body d-flex flex-column text-center">
                <h5 class="card-title">限量莓果乳酪蛋糕</h5>
                <p class="card-text flex-grow-1">
                  結合莓果酸香與乳酪綿密口感，限量供應，讓每一口都更值得期待。

                <a href="#" class="btn btn-outline-danger align-self-end">我要訂購</a>
