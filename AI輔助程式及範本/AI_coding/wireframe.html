<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/wireframe.css" />
    <title>BS5 切版結構</title>
  </head>
  <body>
    <!-- 頁首區：放導覽列 -->
    <header>
      <!-- 導覽列：左邊品牌，右邊選單 -->
      <nav class="navbar navbar-expand-lg navbar-dark wireframe-nav">
        <div class="container-fluid px-3 px-lg-4 py-2">
          <a class="navbar-brand fw-semibold" href="#">navbar-brand</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
            aria-controls="navMenu"
            aria-expanded="false"
            aria-label="切換導覽選單"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navMenu">
            <ul class="navbar-nav align-items-lg-center gap-2">
              <li class="nav-item"><a class="nav-link pill-link active" href="#">li</a></li>
              <li class="nav-item"><a class="nav-link pill-link" href="#">li</a></li>
              <li class="nav-item"><a class="nav-link pill-link" href="#">li</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- banner 區：上面這一大塊 -->
      <section class="banner-area d-flex align-items-center justify-content-center">
        <span class="section-label">banner</span>
      </section>

      <!-- 主要內容區：放下面兩組版面 -->
      <section class="container py-4 py-lg-5">
        <div class="section-label text-center mb-2">container</div>

        <!-- 第一列：左邊文字，右邊圖片 -->
        <div class="wireframe-block p-3 p-lg-4 mb-4">
          <div class="row g-3">
            <!-- 左欄：文字內容 -->
            <div class="col-lg-6">
              <div class="frame-panel h-100 p-3 p-lg-4">
                <div class="mock-box title-box">h3</div>
                <div class="mock-box text-box">p</div>
                <div class="mock-box text-box">p</div>
              </div>
            </div>
            <!-- 右欄：圖片內容 -->
            <div class="col-lg-6">
              <div class="frame-panel h-100 p-3 p-lg-4 d-flex align-items-center justify-content-center">
                <img src="images/cake01.jpg" alt="cake" class="img-fluid image-frame" />
              </div>
            </div>
          </div>
        </div>

        <!-- 第二列：左邊圖片，右邊文字 -->
        <div class="wireframe-block p-3 p-lg-4">
          <div class="row g-3">
            <!-- 左欄：圖片內容 -->
            <div class="col-lg-6 order-lg-1 order-2">
              <div class="frame-panel h-100 p-3 p-lg-4 d-flex align-items-center justify-content-center">
                <img src="images/cake02.jpg" alt="cake" class="img-fluid image-frame" />
              </div>
            </div>
            <!-- 右欄：文字內容 -->
            <div class="col-lg-6 order-lg-2 order-1">
              <div class="frame-panel h-100 p-3 p-lg-4">
                <div class="mock-box title-box">h3</div>
                <div class="mock-box text-box">p</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 頁尾 -->
      <footer class="footer-area text-center py-3">footer</footer>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
